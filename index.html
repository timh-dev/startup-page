<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ede8dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A personal start page: your widgets, bookmarks and vault."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.
      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Start Page</title>
    <script>
      (function () {
        // Suppress ResizeObserver loop errors — benign WebGL canvas resize
        // artifacts that can trigger Vite's error overlay in dev mode.
        window.addEventListener('error', function (e) {
          if (e.message && e.message.includes('ResizeObserver')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // Apply theme before React renders to eliminate flash of unstyled content.
        try {
          var mode = null, palette = null;
          var raw = localStorage.getItem('startup-page.settings');
          if (raw) {
            var p = JSON.parse(raw);
            mode = (p && p.ui && p.ui.themeMode) || null;
            palette = (p && p.ui && p.ui.themePalette) || null;
          }
          if (!mode) mode = localStorage.getItem('color-theme-mode');
          if (!palette) palette = localStorage.getItem('color-theme-palette');
          palette = palette || 'zen';
          var resolved = mode === 'dark' ? 'dark'
            : mode === 'light' ? 'light'
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(resolved);
          document.documentElement.dataset.theme = palette;
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/app/main.ts"></script>
  </head>
  <body class="text-blueGray-100 antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.
      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.
      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
