name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Not a blocking gate yet: the codebase currently has pre-existing type
      # errors unrelated to any given change. Surfaced here so regressions are
      # visible without turning every PR red until those are cleaned up.
      - name: Typecheck (non-blocking)
        run: pnpm run typecheck
        continue-on-error: true

      - name: Build
        run: pnpm run build:local
